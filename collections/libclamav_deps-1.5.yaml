name: libclamav_deps
version: "1.5"
mussels_version: "0.2"
type: collection
platforms:
  Linux:
    host:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
    host-static:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
        - libcheck
        - ncurses

  # ========== 新增：musl 交叉编译支持 ==========
  host-musl-x86_64:
    dependencies:
      - libbz2
      - libjson_c
      - libopenssl
      - libxml2
      - libpcre2
      - libz
      - libiconv
      - ncurses
      - libcheck
      - libcurl
      - libnghttp2
    install_paths:
      license/clamav_deps:
        - README.md
    required_tools:
      - make
      - gcc
      - cmake
      - perl

  host-musl-aarch64:
    dependencies:
      - libbz2
      - libjson_c
      - libopenssl
      - libxml2
      - libpcre2
      - libz
      - libiconv
      - ncurses
      - libcheck
      - libcurl
      - libnghttp2
    install_paths:
      license/clamav_deps:
        - README.md
    required_tools:
      - make
      - gcc
      - cmake
      - perl
  # ==========================================

  Freebsd:
    host:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
    host-static:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
        - libcheck
        - ncurses
  Darwin:
    host:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
        - libcheck
        - ncurses
    host-static:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
        - libcheck
        - ncurses
  Windows:
    x64:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - pthreads_win32
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
        - pdcurses
        - libcheck
    x86:
      dependencies:
        - libz
        - libcurl
        - libjson_c
        - pthreads_win32
        - libxml2
        - libopenssl
        - libpcre2
        - libbz2<1.1.0
        - pdcurses
        - libcheck
